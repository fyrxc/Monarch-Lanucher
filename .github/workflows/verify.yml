name: Verify Next.js Rust Rewrite

on:
  push:
    branches:
      - rewrite/nextjs-rust
  pull_request:

permissions:
  contents: read

concurrency:
  group: rewrite-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Frontend smoke test
        run: npm test -- tests/app-shell.test.tsx
