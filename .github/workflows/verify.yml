name: Verify Next.js Rust Rewrite

on:
  push:
    branches:
      - rewrite/nextjs-rust
  pull_request:

permissions:
  contents: read

concurrency:
  group: rewrite-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Build static frontend
        run: npm run build:web

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Windows installer
        run: npm run tauri build -- --bundles nsis

      - name: Stage setup executable
        shell: pwsh
        run: |
          $installer = Get-ChildItem '.\src-tauri\target\release\bundle\nsis\*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS setup executable was not produced.' }
          New-Item -ItemType Directory -Force '.\release' | Out-Null
          Copy-Item $installer.FullName '.\release\MonarchLauncher-Setup.exe' -Force
          Get-Item '.\release\MonarchLauncher-Setup.exe' | Format-List Name,Length,FullName

      - name: Upload setup executable
        uses: actions/upload-artifact@v4
        with:
          name: MonarchLauncher-Setup
          path: release/MonarchLauncher-Setup.exe
          if-no-files-found: error
