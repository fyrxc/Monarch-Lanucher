name: Verify Next.js Rust Rewrite

on:
  push:
    branches:
      - rewrite/nextjs-rust
  pull_request:

permissions:
  contents: read

concurrency:
  group: rewrite-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  MONARCH_DISCORD_APP_ID: '1543377507770826762'

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Build static frontend
        run: npm run build:web

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Windows installer
        env:
          MONARCH_UPDATER_PUBLIC_KEY: ${{ vars.MONARCH_UPDATER_PUBLIC_KEY }}
        run: npm run tauri build -- --bundles nsis

      - name: Smoke test launcher startup
        shell: pwsh
        run: |
          $exe = Resolve-Path '.\src-tauri\target\release\monarch_launcher.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'monarch-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'monarch-stderr.log'
          $process = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            Write-Host 'Launcher exited during startup smoke test.'
            Write-Host "Exit code: $($process.ExitCode)"
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            throw 'Monarch Launcher did not remain running after startup.'
          }
          Stop-Process -Id $process.Id -Force
          Write-Host 'Launcher remained running for the startup smoke test.'

      - name: Stage setup executable
        shell: pwsh
        run: |
          $installer = Get-ChildItem '.\src-tauri\target\release\bundle\nsis\*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS setup executable was not produced.' }
          New-Item -ItemType Directory -Force '.\release' | Out-Null
          Copy-Item $installer.FullName '.\release\MonarchLauncher-Setup.exe' -Force
          Get-Item '.\release\MonarchLauncher-Setup.exe' | Format-List Name,Length,FullName

      - name: Upload setup executable
        uses: actions/upload-artifact@v4
        with:
          name: MonarchLauncher-Setup
          path: release/MonarchLauncher-Setup.exe
          if-no-files-found: error
